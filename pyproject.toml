[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "appsec-review-smoke-python"
version = "0.1.0"
description = "Deliberately vulnerable smoke target for appsec-review; do not deploy."
requires-python = ">=3.12"
dependencies = [
  "requests==2.33.0",
]

[tool.setuptools.packages.find]
where = ["src"]
